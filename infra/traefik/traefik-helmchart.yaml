apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  repo: https://traefik.github.io/charts
  chart: traefik
  targetNamespace: traefik
  createNamespace: true
  valuesContent: |-
    deployment:
      replicas: 1

    service:
      enabled: true
      type: NodePort

    ports:
      web:
        port: 80
        expose:
          default: true
        exposedPort: 80
        nodePort: 30080
        protocol: TCP
      websecure:
        port: 443
        expose:
          default: true
        exposedPort: 443
        nodePort: 30443
        protocol: TCP

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik
